<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1920" version="1.1" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <!--
      Variante mobile (art direction) dello sfondo hero:
      stessa scena del desktop ricomposta in verticale, con luna e sole
      vicini al centro cosi' restano visibili con background-size: cover.
    -->
    <defs>
        <linearGradient id="nightSky" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#35879B"/>
            <stop offset="0.55" stop-color="#1E5A68"/>
            <stop offset="1" stop-color="#143F4B"/>
        </linearGradient>
        <linearGradient id="daySky" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#FFD45C"/>
            <stop offset="0.55" stop-color="#F0AC33"/>
            <stop offset="1" stop-color="#DB8B22"/>
        </linearGradient>
        <radialGradient id="moonGlow">
            <stop offset="0" stop-color="#FF6FA5" stop-opacity="0.45"/>
            <stop offset="1" stop-color="#FF6FA5" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="sunGlow">
            <stop offset="0" stop-color="#FFE9A8" stop-opacity="0.7"/>
            <stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="seamGlow">
            <stop offset="0" stop-color="#FFF4DC" stop-opacity="0.18"/>
            <stop offset="1" stop-color="#FFF4DC" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.8">
            <stop offset="0.55" stop-color="#071B22" stop-opacity="0"/>
            <stop offset="1" stop-color="#071B22" stop-opacity="0.5"/>
        </radialGradient>

        <pattern id="dots" x="0" y="0" width="46" height="46" patternUnits="userSpaceOnUse">
            <circle cx="11" cy="11" r="5" fill="#071B22" opacity="0.07"/>
            <circle cx="34" cy="34" r="5" fill="#071B22" opacity="0.07"/>
        </pattern>
        <linearGradient id="dotsFadeGrad" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#fff"/>
            <stop offset="0.6" stop-color="#000"/>
        </linearGradient>
        <mask id="dotsFade">
            <rect width="1080" height="1920" fill="url(#dotsFadeGrad)"/>
        </mask>

        <filter id="grain" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
            <feColorMatrix type="saturate" values="0"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.07" intercept="0"/>
            </feComponentTransfer>
        </filter>

        <mask id="crescent">
            <circle cx="280" cy="420" r="115" fill="#fff"/>
            <circle cx="338" cy="372" r="93" fill="#000"/>
        </mask>

        <g id="cloud">
            <circle cx="40" cy="36" r="28"/>
            <circle cx="84" cy="22" r="38"/>
            <circle cx="130" cy="38" r="26"/>
            <rect x="12" y="34" width="144" height="30" rx="15"/>
        </g>
        <path id="spark" d="M0 -22 C3 -8 8 -3 22 0 C8 3 3 8 0 22 C-3 8 -8 3 -22 0 C-8 -3 -3 -8 0 -22 Z"/>
        <rect id="ray" x="-8" y="-160" width="16" height="54" rx="8"/>
        <g id="tree">
            <circle cx="0" cy="-72" r="46"/>
            <circle cx="-36" cy="-38" r="38"/>
            <circle cx="36" cy="-38" r="38"/>
            <rect x="-10" y="-34" width="20" height="70" rx="9"/>
        </g>
    </defs>

    <!-- ===== Cielo ===== -->
    <rect x="0" y="0" width="540" height="1920" fill="url(#nightSky)"/>
    <rect x="540" y="0" width="540" height="1920" fill="url(#daySky)"/>
    <ellipse cx="540" cy="960" rx="150" ry="1100" fill="url(#seamGlow)"/>

    <rect width="1080" height="1920" fill="url(#dots)" mask="url(#dotsFade)"/>

    <!-- ===== Lato notte ===== -->
    <circle cx="280" cy="420" r="250" fill="url(#moonGlow)"/>
    <g mask="url(#crescent)">
        <circle cx="280" cy="420" r="115" fill="#FF6FA5"/>
        <circle cx="240" cy="460" r="18" fill="#E85C92"/>
        <circle cx="218" cy="400" r="11" fill="#E85C92"/>
        <circle cx="272" cy="508" r="9" fill="#E85C92"/>
    </g>

    <g fill="#FFF4DC">
        <circle cx="90" cy="180" r="4" opacity="0.9"/>
        <circle cx="300" cy="120" r="3" opacity="0.7"/>
        <circle cx="460" cy="240" r="4" opacity="0.85"/>
        <circle cx="150" cy="640" r="3" opacity="0.6"/>
        <circle cx="420" cy="720" r="3" opacity="0.6"/>
    </g>
    <use href="#spark" transform="translate(430 480) scale(0.85)" fill="#FF6FA5" opacity="0.95"/>
    <use href="#spark" transform="translate(120 800) scale(0.7)" fill="#FF6FA5" opacity="0.8"/>

    <use href="#cloud" transform="translate(60 200) scale(0.9)" fill="#FFF4DC" opacity="0.95"/>
    <use href="#cloud" transform="translate(280 640) scale(0.6)" fill="#FF9FC2" opacity="0.9"/>

    <!-- ===== Lato giorno ===== -->
    <circle cx="800" cy="420" r="265" fill="url(#sunGlow)"/>
    <g fill="#F2762E" transform="translate(800 420)">
        <use href="#ray"/>
        <use href="#ray" transform="rotate(45)"/>
        <use href="#ray" transform="rotate(90)"/>
        <use href="#ray" transform="rotate(135)"/>
        <use href="#ray" transform="rotate(180)"/>
        <use href="#ray" transform="rotate(225)"/>
        <use href="#ray" transform="rotate(270)"/>
        <use href="#ray" transform="rotate(315)"/>
    </g>
    <circle cx="800" cy="420" r="88" fill="#F2762E"/>
    <circle cx="800" cy="420" r="65" fill="#FF8C42"/>
    <circle cx="776" cy="396" r="19" fill="#FFAD66"/>

    <use href="#cloud" transform="translate(620 180) scale(0.8)" fill="#FF6FA5" opacity="0.9"/>
    <use href="#cloud" transform="translate(840 660) scale(0.65)" fill="#FFF4DC" opacity="0.95"/>
    <use href="#spark" transform="translate(640 560) scale(0.8)" fill="#FFF4DC" opacity="0.95"/>
    <use href="#spark" transform="translate(980 300) scale(0.65)" fill="#FFF4DC" opacity="0.85"/>

    <!-- ===== Profondita' ===== -->
    <path d="M0 1530 Q140 1470 300 1505 T620 1495 T940 1505 T1080 1480 L1080 1920 L0 1920 Z"
          fill="#123842" opacity="0.85"/>

    <g fill="#0B2530">
        <rect x="0" y="1620" width="1080" height="300"/>
        <use href="#tree" transform="translate(90 1640) scale(0.9)"/>
        <use href="#tree" transform="translate(300 1635) scale(1.1)"/>
        <use href="#tree" transform="translate(520 1645) scale(0.85)"/>
        <use href="#tree" transform="translate(730 1638) scale(1.0)"/>
        <use href="#tree" transform="translate(960 1642) scale(0.95)"/>
    </g>

    <g fill="#FFC93C">
        <circle cx="200" cy="1590" r="4" opacity="0.8"/>
        <circle cx="560" cy="1620" r="3" opacity="0.6"/>
        <circle cx="860" cy="1600" r="4" opacity="0.7"/>
    </g>

    <g fill="#06161C">
        <circle cx="20" cy="1930" r="150"/>
        <circle cx="1060" cy="1940" r="160"/>
    </g>

    <!-- ===== Finiture ===== -->
    <rect width="1080" height="1920" filter="url(#grain)"/>
    <rect width="1080" height="1920" fill="url(#vignette)"/>
</svg>
