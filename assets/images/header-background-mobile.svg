<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1920" version="1.1" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <!--
      Variante mobile (art direction) dello sfondo hero: stessa scena del
      desktop ricomposta in verticale, con le stesse micro-animazioni soft.
    -->
    <style>
        @keyframes drift {
            from { transform: translateX(-16px); }
            to   { transform: translateX(16px); }
        }
        @keyframes floaty {
            from { transform: translateY(-6px); }
            to   { transform: translateY(6px); }
        }
        @keyframes raysSpin {
            to { transform: rotate(360deg); }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.35; }
            50%      { opacity: 1; }
        }
        @keyframes flicker {
            0%, 100% { opacity: 0.15; transform: translateY(0); }
            50%      { opacity: 0.85; transform: translateY(-5px); }
        }
        .drift   { animation: drift 18s ease-in-out infinite alternate; }
        .drift-2 { animation: drift 26s ease-in-out infinite alternate; animation-delay: -9s; }
        .drift-3 { animation: drift 22s ease-in-out infinite alternate-reverse; animation-delay: -4s; }
        .floaty  { animation: floaty 9s ease-in-out infinite alternate; }
        .rays    { animation: raysSpin 90s linear infinite; }
        .tw      { animation: twinkle 4s ease-in-out infinite; }
        .tw-2    { animation: twinkle 5.5s ease-in-out infinite; animation-delay: -2s; }
        .tw-3    { animation: twinkle 3.2s ease-in-out infinite; animation-delay: -1.2s; }
        .ff      { animation: flicker 6s ease-in-out infinite; }
        .ff-2    { animation: flicker 7.5s ease-in-out infinite; animation-delay: -3s; }
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; }
        }
    </style>
    <defs>
        <linearGradient id="nightSky" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#35879B"/>
            <stop offset="0.55" stop-color="#1E5A68"/>
            <stop offset="1" stop-color="#143F4B"/>
        </linearGradient>
        <linearGradient id="daySky" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#FFD45C"/>
            <stop offset="0.55" stop-color="#F0AC33"/>
            <stop offset="1" stop-color="#DB8B22"/>
        </linearGradient>
        <radialGradient id="moonGlow">
            <stop offset="0" stop-color="#FF6FA5" stop-opacity="0.45"/>
            <stop offset="1" stop-color="#FF6FA5" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="sunGlow">
            <stop offset="0" stop-color="#FFE9A8" stop-opacity="0.7"/>
            <stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="seamGlow">
            <stop offset="0" stop-color="#FFF4DC" stop-opacity="0.18"/>
            <stop offset="1" stop-color="#FFF4DC" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.8">
            <stop offset="0.55" stop-color="#071B22" stop-opacity="0"/>
            <stop offset="1" stop-color="#071B22" stop-opacity="0.5"/>
        </radialGradient>

        <pattern id="dots" x="0" y="0" width="46" height="46" patternUnits="userSpaceOnUse">
            <circle cx="11" cy="11" r="5" fill="#071B22" opacity="0.07"/>
            <circle cx="34" cy="34" r="5" fill="#071B22" opacity="0.07"/>
        </pattern>
        <linearGradient id="dotsFadeGrad" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#fff"/>
            <stop offset="0.6" stop-color="#000"/>
        </linearGradient>
        <mask id="dotsFade">
            <rect width="1080" height="1920" fill="url(#dotsFadeGrad)"/>
        </mask>

        <filter id="grainF" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
            <feColorMatrix type="saturate" values="0"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.07" intercept="0"/>
            </feComponentTransfer>
        </filter>
        <pattern id="grain" x="0" y="0" width="240" height="240" patternUnits="userSpaceOnUse">
            <rect width="240" height="240" filter="url(#grainF)"/>
        </pattern>

        <mask id="crescent">
            <circle cx="270" cy="390" r="115" fill="#fff"/>
            <circle cx="328" cy="342" r="93" fill="#000"/>
        </mask>

        <g id="cloud">
            <circle cx="40" cy="36" r="28"/>
            <circle cx="84" cy="22" r="38"/>
            <circle cx="130" cy="38" r="26"/>
            <rect x="12" y="34" width="144" height="30" rx="15"/>
        </g>
        <path id="spark" d="M0 -22 C3 -8 8 -3 22 0 C8 3 3 8 0 22 C-3 8 -8 3 -22 0 C-8 -3 -3 -8 0 -22 Z"/>
        <rect id="ray" x="-8" y="-160" width="16" height="54" rx="8"/>
        <g id="tree">
            <circle cx="0" cy="-72" r="46"/>
            <circle cx="-36" cy="-38" r="38"/>
            <circle cx="36" cy="-38" r="38"/>
            <rect x="-10" y="-34" width="20" height="70" rx="9"/>
        </g>
    </defs>

    <!-- ===== Cielo ===== -->
    <rect x="0" y="0" width="540" height="1920" fill="url(#nightSky)"/>
    <rect x="540" y="0" width="540" height="1920" fill="url(#daySky)"/>
    <ellipse cx="540" cy="960" rx="150" ry="1100" fill="url(#seamGlow)"/>

    <rect width="1080" height="1920" fill="url(#dots)" mask="url(#dotsFade)"/>

    <!-- ===== Lato notte ===== -->
    <g class="floaty">
        <circle cx="270" cy="390" r="250" fill="url(#moonGlow)"/>
        <g mask="url(#crescent)">
            <circle cx="270" cy="390" r="115" fill="#FF6FA5"/>
            <circle cx="230" cy="430" r="18" fill="#E85C92"/>
            <circle cx="208" cy="370" r="11" fill="#E85C92"/>
            <circle cx="262" cy="478" r="9" fill="#E85C92"/>
        </g>
    </g>

    <g fill="#FFF4DC">
        <circle class="tw" cx="90" cy="180" r="4"/>
        <circle class="tw-2" cx="300" cy="115" r="3"/>
        <circle class="tw-3" cx="460" cy="250" r="4"/>
        <circle class="tw-2" cx="150" cy="640" r="3"/>
        <circle class="tw" cx="430" cy="730" r="3"/>
    </g>
    <g class="tw-2"><use href="#spark" transform="translate(440 500) scale(0.85)" fill="#FF6FA5"/></g>
    <g class="tw"><use href="#spark" transform="translate(110 820) scale(0.7)" fill="#FF6FA5"/></g>

    <g class="drift"><use href="#cloud" transform="translate(40 190) scale(0.95)" fill="#FFF4DC" opacity="0.95"/></g>
    <g class="drift-3"><use href="#cloud" transform="translate(300 670) scale(0.55)" fill="#FF9FC2" opacity="0.9"/></g>

    <!-- Nuvola sul confine notte/giorno -->
    <g class="drift-2"><use href="#cloud" transform="translate(460 120) scale(0.75)" fill="#FFF4DC" opacity="0.92"/></g>

    <!-- ===== Lato giorno ===== -->
    <circle cx="820" cy="470" r="265" fill="url(#sunGlow)"/>
    <g transform="translate(820 470)">
        <g class="rays" fill="#F2762E">
            <use href="#ray"/>
            <use href="#ray" transform="rotate(45)"/>
            <use href="#ray" transform="rotate(90)"/>
            <use href="#ray" transform="rotate(135)"/>
            <use href="#ray" transform="rotate(180)"/>
            <use href="#ray" transform="rotate(225)"/>
            <use href="#ray" transform="rotate(270)"/>
            <use href="#ray" transform="rotate(315)"/>
        </g>
    </g>
    <circle cx="820" cy="470" r="88" fill="#F2762E"/>
    <circle cx="820" cy="470" r="65" fill="#FF8C42"/>
    <circle cx="796" cy="446" r="19" fill="#FFAD66"/>

    <g class="drift-3"><use href="#cloud" transform="translate(650 210) scale(0.6)" fill="#FF6FA5" opacity="0.9"/></g>
    <g class="drift"><use href="#cloud" transform="translate(830 700) scale(0.8)" fill="#FFF4DC" opacity="0.95"/></g>
    <g class="tw"><use href="#spark" transform="translate(630 580) scale(0.8)" fill="#FFF4DC"/></g>
    <g class="tw-3"><use href="#spark" transform="translate(990 280) scale(0.65)" fill="#FFF4DC"/></g>
    <g fill="#FFF4DC">
        <circle class="tw-3" cx="720" cy="110" r="3"/>
        <circle class="tw" cx="1000" cy="160" r="3"/>
    </g>

    <!-- ===== Profondita' ===== -->
    <path d="M0 1510 Q150 1455 320 1500 T640 1510 T960 1520 T1080 1500 L1080 1920 L0 1920 Z"
          fill="#123842" opacity="0.85"/>

    <g fill="#0B2530">
        <rect x="0" y="1620" width="1080" height="300"/>
        <use href="#tree" transform="translate(70 1640) scale(0.95)"/>
        <use href="#tree" transform="translate(250 1632) scale(1.2)"/>
        <use href="#tree" transform="translate(560 1648) scale(0.75)"/>
        <use href="#tree" transform="translate(740 1638) scale(1.05)"/>
        <use href="#tree" transform="translate(1010 1644) scale(0.85)"/>
    </g>

    <g fill="#FFC93C">
        <circle class="ff" cx="210" cy="1592" r="4"/>
        <circle class="ff-2" cx="570" cy="1622" r="3"/>
        <circle class="ff" cx="870" cy="1600" r="4"/>
    </g>

    <g fill="#06161C">
        <circle cx="20" cy="1930" r="150"/>
        <circle cx="1060" cy="1925" r="175"/>
    </g>

    <!-- ===== Finiture ===== -->
    <rect width="1080" height="1920" fill="url(#grain)"/>
    <rect width="1080" height="1920" fill="url(#vignette)"/>
</svg>
