<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" version="1.1" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <!--
      Sfondo hero "Roviano CGR Pop Tributes 2026" (desktop).
      Composizione a livelli: cielo diviso notte/giorno, astri con glow,
      nuvole cartoon, halftone sfumato, tre piani di alberi per la profondita',
      grana feTurbulence e vignettatura per la leggibilita' del testo.
    -->
    <defs>
        <linearGradient id="nightSky" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#35879B"/>
            <stop offset="0.55" stop-color="#1E5A68"/>
            <stop offset="1" stop-color="#143F4B"/>
        </linearGradient>
        <linearGradient id="daySky" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#FFD45C"/>
            <stop offset="0.55" stop-color="#F0AC33"/>
            <stop offset="1" stop-color="#DB8B22"/>
        </linearGradient>
        <radialGradient id="moonGlow">
            <stop offset="0" stop-color="#FF6FA5" stop-opacity="0.45"/>
            <stop offset="1" stop-color="#FF6FA5" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="sunGlow">
            <stop offset="0" stop-color="#FFE9A8" stop-opacity="0.7"/>
            <stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="seamGlow">
            <stop offset="0" stop-color="#FFF4DC" stop-opacity="0.18"/>
            <stop offset="1" stop-color="#FFF4DC" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
            <stop offset="0.55" stop-color="#071B22" stop-opacity="0"/>
            <stop offset="1" stop-color="#071B22" stop-opacity="0.5"/>
        </radialGradient>

        <!-- Halftone che sfuma scendendo, come nelle stampe pop -->
        <pattern id="dots" x="0" y="0" width="46" height="46" patternUnits="userSpaceOnUse">
            <circle cx="11" cy="11" r="5" fill="#071B22" opacity="0.07"/>
            <circle cx="34" cy="34" r="5" fill="#071B22" opacity="0.07"/>
        </pattern>
        <linearGradient id="dotsFadeGrad" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#fff"/>
            <stop offset="0.65" stop-color="#000"/>
        </linearGradient>
        <mask id="dotsFade">
            <rect width="1920" height="1080" fill="url(#dotsFadeGrad)"/>
        </mask>

        <!-- Grana sottile per togliere l'effetto "piatto digitale" -->
        <filter id="grain" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
            <feColorMatrix type="saturate" values="0"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.07" intercept="0"/>
            </feComponentTransfer>
        </filter>

        <!-- Falce di luna: cerchio pieno meno cerchio sfalsato -->
        <mask id="crescent">
            <circle cx="340" cy="300" r="130" fill="#fff"/>
            <circle cx="405" cy="245" r="105" fill="#000"/>
        </mask>

        <!-- Nuvola cartoon a base piatta -->
        <g id="cloud">
            <circle cx="40" cy="36" r="28"/>
            <circle cx="84" cy="22" r="38"/>
            <circle cx="130" cy="38" r="26"/>
            <rect x="12" y="34" width="144" height="30" rx="15"/>
        </g>

        <!-- Scintilla a quattro punte -->
        <path id="spark" d="M0 -22 C3 -8 8 -3 22 0 C8 3 3 8 0 22 C-3 8 -8 3 -22 0 C-8 -3 -3 -8 0 -22 Z"/>

        <!-- Raggio di sole arrotondato -->
        <rect id="ray" x="-9" y="-185" width="18" height="62" rx="9"/>

        <!-- Albero a chioma tonda -->
        <g id="tree">
            <circle cx="0" cy="-72" r="46"/>
            <circle cx="-36" cy="-38" r="38"/>
            <circle cx="36" cy="-38" r="38"/>
            <rect x="-10" y="-34" width="20" height="70" rx="9"/>
        </g>
    </defs>

    <!-- ===== Cielo ===== -->
    <rect x="0" y="0" width="960" height="1080" fill="url(#nightSky)"/>
    <rect x="960" y="0" width="960" height="1080" fill="url(#daySky)"/>
    <!-- Bagliore morbido sulla linea che separa notte e giorno -->
    <ellipse cx="960" cy="540" rx="190" ry="700" fill="url(#seamGlow)"/>

    <!-- Halftone -->
    <rect width="1920" height="1080" fill="url(#dots)" mask="url(#dotsFade)"/>

    <!-- ===== Lato notte ===== -->
    <circle cx="340" cy="300" r="280" fill="url(#moonGlow)"/>
    <g mask="url(#crescent)">
        <circle cx="340" cy="300" r="130" fill="#FF6FA5"/>
        <circle cx="295" cy="345" r="20" fill="#E85C92"/>
        <circle cx="270" cy="280" r="13" fill="#E85C92"/>
        <circle cx="330" cy="400" r="10" fill="#E85C92"/>
    </g>

    <g fill="#FFF4DC">
        <circle cx="140" cy="150" r="4" opacity="0.9"/>
        <circle cx="430" cy="105" r="3" opacity="0.7"/>
        <circle cx="640" cy="210" r="4" opacity="0.85"/>
        <circle cx="800" cy="120" r="3" opacity="0.7"/>
        <circle cx="240" cy="500" r="3" opacity="0.6"/>
        <circle cx="700" cy="480" r="3" opacity="0.6"/>
        <circle cx="560" cy="640" r="3" opacity="0.5"/>
    </g>
    <use href="#spark" x="0" y="0" transform="translate(540 330)" fill="#FF6FA5" opacity="0.95"/>
    <use href="#spark" transform="translate(820 240) scale(0.65)" fill="#FFF4DC" opacity="0.9"/>
    <use href="#spark" transform="translate(180 640) scale(0.8)" fill="#FF6FA5" opacity="0.8"/>

    <use href="#cloud" transform="translate(520 130) scale(1.15)" fill="#FFF4DC" opacity="0.95"/>
    <use href="#cloud" transform="translate(120 470) scale(0.8)" fill="#FFF4DC" opacity="0.85"/>
    <use href="#cloud" transform="translate(740 420) scale(0.6)" fill="#FF9FC2" opacity="0.9"/>

    <!-- ===== Lato giorno ===== -->
    <circle cx="1580" cy="300" r="300" fill="url(#sunGlow)"/>
    <g fill="#F2762E" transform="translate(1580 300)">
        <use href="#ray"/>
        <use href="#ray" transform="rotate(45)"/>
        <use href="#ray" transform="rotate(90)"/>
        <use href="#ray" transform="rotate(135)"/>
        <use href="#ray" transform="rotate(180)"/>
        <use href="#ray" transform="rotate(225)"/>
        <use href="#ray" transform="rotate(270)"/>
        <use href="#ray" transform="rotate(315)"/>
    </g>
    <circle cx="1580" cy="300" r="100" fill="#F2762E"/>
    <circle cx="1580" cy="300" r="74" fill="#FF8C42"/>
    <circle cx="1552" cy="272" r="22" fill="#FFAD66"/>

    <use href="#cloud" transform="translate(1130 140) scale(1.0)" fill="#FF6FA5" opacity="0.9"/>
    <use href="#cloud" transform="translate(1700 430) scale(0.85)" fill="#FFF4DC" opacity="0.95"/>
    <use href="#cloud" transform="translate(1300 520) scale(0.55)" fill="#FF9FC2" opacity="0.85"/>
    <use href="#spark" transform="translate(1180 330) scale(0.9)" fill="#FFF4DC" opacity="0.95"/>
    <use href="#spark" transform="translate(1840 230) scale(0.7)" fill="#FFF4DC" opacity="0.85"/>
    <use href="#spark" transform="translate(1450 600) scale(0.6)" fill="#FFF4DC" opacity="0.7"/>

    <!-- ===== Profondita': tre piani di colline e alberi ===== -->
    <!-- Piano lontano -->
    <path d="M0 820 Q200 760 420 800 T880 790 T1340 800 T1920 770 L1920 1080 L0 1080 Z"
          fill="#123842" opacity="0.85"/>

    <!-- Piano medio: fila di alberi -->
    <g fill="#0B2530">
        <rect x="0" y="930" width="1920" height="150"/>
        <use href="#tree" transform="translate(110 950) scale(0.9)"/>
        <use href="#tree" transform="translate(330 945) scale(1.1)"/>
        <use href="#tree" transform="translate(560 955) scale(0.8)"/>
        <use href="#tree" transform="translate(780 948) scale(1.0)"/>
        <use href="#tree" transform="translate(990 956) scale(0.85)"/>
        <use href="#tree" transform="translate(1190 946) scale(1.05)"/>
        <use href="#tree" transform="translate(1420 954) scale(0.9)"/>
        <use href="#tree" transform="translate(1650 944) scale(1.1)"/>
        <use href="#tree" transform="translate(1850 952) scale(0.85)"/>
    </g>

    <!-- Lucciole sopra il bosco -->
    <g fill="#FFC93C">
        <circle cx="300" cy="900" r="4" opacity="0.8"/>
        <circle cx="690" cy="940" r="3" opacity="0.6"/>
        <circle cx="1240" cy="915" r="4" opacity="0.7"/>
        <circle cx="1580" cy="945" r="3" opacity="0.6"/>
        <circle cx="940" cy="890" r="3" opacity="0.65"/>
    </g>

    <!-- Piano vicino: quinte scure agli angoli -->
    <g fill="#06161C">
        <circle cx="40" cy="1090" r="190"/>
        <circle cx="220" cy="1140" r="150"/>
        <circle cx="1880" cy="1100" r="200"/>
        <circle cx="1690" cy="1150" r="150"/>
    </g>

    <!-- ===== Finiture ===== -->
    <rect width="1920" height="1080" filter="url(#grain)"/>
    <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
